# njsscan is a static security code scanner for insecure Node.js code patterns.
# Results are uploaded to GitHub Code Scanning.

name: njsscan sarif

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '24 17 * * 3'

permissions:
  contents: read

jobs:
  njsscan:
    name: njsscan code scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nodejsscan scan
        id: njsscan
        uses: ajinabraham/njsscan-action@231750a435d85095d33be7d192d52ec650625146 # v9
        with:
          args: '. --sarif --output results.sarif || true'
      - name: Upload njsscan report
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
          category: njsscan
